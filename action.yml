name: MCP Tool Bench
description: Lint an MCP server's tools (names, descriptions, JSON Schema 2020-12) and optionally run tool-selection evals against a model.
author: Ashutosh Singh
branding:
  icon: check-circle
  color: gray-dark

inputs:
  server:
    description: Command that starts the server over stdio (e.g. "python -m my_server"), or a Streamable HTTP URL.
    required: true
  setup:
    description: Shell command to install the server first (e.g. "pip install -e ." or "npm ci && npm run build").
    required: false
    default: ""
  working-directory:
    description: Directory to run setup and the server from.
    required: false
    default: "."
  strict:
    description: Fail on lint warnings, not just errors.
    required: false
    default: "false"
  cases:
    description: Path to a YAML file of eval cases. Leave empty to skip evals.
    required: false
    default: ""
  model:
    description: Model or deployment name for evals.
    required: false
    default: "openai/gpt-4.1-mini"
  base-url:
    description: OpenAI-compatible endpoint for evals. Defaults to GitHub Models, which works with the workflow's GITHUB_TOKEN.
    required: false
    default: "https://models.github.ai/inference"
  api-key:
    description: "API key for the eval endpoint. Defaults to the workflow token, which needs the models: read permission."
    required: false
    default: ${{ github.token }}
  min-accuracy:
    description: Fail the eval step below this tool-selection accuracy (0 to 1).
    required: false
    default: "0.9"
  python-version:
    description: Python version used to run the bench.
    required: false
    default: "3.12"

outputs:
  lint-report:
    description: Path to the lint JSON report.
    value: ${{ steps.lint.outputs.report }}
  eval-report:
    description: Path to the eval JSON report (empty when evals were skipped).
    value: ${{ steps.eval.outputs.report }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install mcp-tool-bench
      shell: bash
      run: python -m pip install --quiet "${GITHUB_ACTION_PATH}[eval]"

    - name: Set up server
      if: inputs.setup != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.setup }}

    - name: Lint tools
      id: lint
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SERVER: ${{ inputs.server }}
        STRICT: ${{ inputs.strict }}
      run: |
        report="${RUNNER_TEMP}/mcp-lint.json"
        flags=()
        [ "$STRICT" = "true" ] && flags+=(--strict)
        echo "report=$report" >> "$GITHUB_OUTPUT"
        mcp-tool-bench lint "$SERVER" --json "$report" "${flags[@]}"

    - name: Tool-selection evals
      id: eval
      if: inputs.cases != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SERVER: ${{ inputs.server }}
        CASES: ${{ inputs.cases }}
        MODEL: ${{ inputs.model }}
        BASE_URL: ${{ inputs.base-url }}
        MIN_ACCURACY: ${{ inputs.min-accuracy }}
        MCP_BENCH_API_KEY: ${{ inputs.api-key }}
      run: |
        report="${RUNNER_TEMP}/mcp-eval.json"
        echo "report=$report" >> "$GITHUB_OUTPUT"
        mcp-tool-bench eval "$SERVER" --cases "$CASES" --model "$MODEL" --base-url "$BASE_URL" \
          --api-key-env MCP_BENCH_API_KEY --min-accuracy "$MIN_ACCURACY" --json "$report"
