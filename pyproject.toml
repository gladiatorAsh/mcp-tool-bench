[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-tool-bench"
version = "0.1.0"
description = "Conformance checks and tool-selection evals for MCP servers"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ashutosh Singh" }]
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "jsonschema>=4.21", "pyyaml>=6"]
keywords = ["mcp", "model-context-protocol", "evals", "llm", "tool-calling"]

[project.optional-dependencies]
eval = ["openai>=1.50"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
mcp-tool-bench = "mcp_tool_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_tool_bench"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
