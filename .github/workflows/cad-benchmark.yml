name: CAD benchmark
# Runs benchmarks/cad against the CAD MCP servers on GitHub Models (free, uses the workflow token).
# No CAD software is needed: evals only show the model each server's tool catalog.
on:
  workflow_dispatch:
    inputs:
      models:
        description: Space-separated GitHub Models ids
        default: "openai/gpt-4.1-mini openai/gpt-4o-mini openai/gpt-4.1-nano"
      limit:
        description: Only run the first N cases (0 = all)
        default: "0"
  schedule:
    - cron: "17 14 * * 1"   # Mondays

permissions:
  contents: read
  models: read

jobs:
  bench:
    name: ${{ matrix.server }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: freecad-mcp-server
            module: freecad_mcp
          - server: fusion-mcp-server
            module: fusion_mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[eval]" "git+https://github.com/gladiatorAsh/${{ matrix.server }}"
      - name: Check GitHub Models access
        env:
          GITHUB_MODELS_TOKEN: ${{ github.token }}
        run: |
          for variant in plain github-headers; do
            extra=()
            [ "$variant" = github-headers ] && extra=(-H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
            code=$(curl -s -o /tmp/resp -w "%{http_code} %{content_type}" https://models.github.ai/inference/chat/completions \
              -H "Authorization: Bearer $GITHUB_MODELS_TOKEN" -H "Content-Type: application/json" "${extra[@]}" \
              -d '{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Say OK"}],"max_tokens":5}')
            echo "$variant: $code $(head -c 200 /tmp/resp)"
          done
      - name: Run the benchmark
        env:
          MODELS: ${{ inputs.models || 'openai/gpt-4.1-mini openai/gpt-4o-mini openai/gpt-4.1-nano' }}
          GITHUB_MODELS_TOKEN: ${{ github.token }}
        run: |
          flags=()
          for m in $MODELS; do flags+=(--model "$m"); done
          mcp-tool-bench eval "python -m ${{ matrix.module }}" \
            --cases benchmarks/cad/cases.yaml "${flags[@]}" \
            --base-url https://models.github.ai/inference --api-key-env GITHUB_MODELS_TOKEN \
            --delay 4 --min-accuracy 0 --limit "${{ inputs.limit || 0 }}" --json "reports/${{ matrix.server }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cad-benchmark-${{ matrix.server }}
          path: reports/
