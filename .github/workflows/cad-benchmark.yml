name: CAD benchmark
# Runs benchmarks/cad against the CAD MCP servers on GitHub Models (free, uses the workflow token).
# No CAD software is needed: evals only show the model each server's tool catalog.
on:
  workflow_dispatch:
    inputs:
      models:
        description: Space-separated GitHub Models ids
        default: "openai/gpt-4.1-mini openai/gpt-4o-mini openai/gpt-4.1-nano"
      limit:
        description: Only run the first N cases (0 = all)
        default: "0"
  schedule:
    - cron: "17 14 * * 1"   # Mondays

permissions:
  contents: read
  models: read

jobs:
  bench:
    name: ${{ matrix.server }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: freecad-mcp-server
            module: freecad_mcp
          - server: fusion-mcp-server
            module: fusion_mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[eval]" "git+https://github.com/gladiatorAsh/${{ matrix.server }}"
      - name: Check the model endpoint
        # Uses BENCH_BASE_URL / BENCH_API_KEY secrets if set (any OpenAI-compatible endpoint),
        # otherwise GitHub Models with the workflow token.
        env:
          BENCH_BASE_URL: ${{ secrets.BENCH_BASE_URL }}
          BENCH_API_KEY: ${{ secrets.BENCH_API_KEY || github.token }}
          FIRST_MODEL: ${{ inputs.models || 'openai/gpt-4.1-mini' }}
        run: |
          base="${BENCH_BASE_URL:-https://models.github.ai/inference}"
          model="${FIRST_MODEL%% *}"
          echo "BENCH_URL=$base" >> "$GITHUB_ENV"
          result=$(curl -s -o /tmp/resp -w "%{http_code} %{content_type}" "$base/chat/completions" \
            -H "Authorization: Bearer $BENCH_API_KEY" -H "Content-Type: application/json" \
            -d "{\"model\":\"$model\",\"messages\":[{\"role\":\"user\",\"content\":\"Say OK\"}],\"max_tokens\":5}")
          echo "$base -> $result"
          case "$result" in
            200*json*) echo "Endpoint returns completions." ;;
            *) echo "::error::$base didn't return a chat completion ($result: $(head -c 120 /tmp/resp)). For GitHub Models, check that Models is enabled for this account; or set BENCH_BASE_URL and BENCH_API_KEY secrets for another OpenAI-compatible endpoint."
               exit 1 ;;
          esac
      - name: Run the benchmark
        env:
          MODELS: ${{ inputs.models || 'openai/gpt-4.1-mini openai/gpt-4o-mini openai/gpt-4.1-nano' }}
          BENCH_API_KEY: ${{ secrets.BENCH_API_KEY || github.token }}
        run: |
          flags=()
          for m in $MODELS; do flags+=(--model "$m"); done
          mcp-tool-bench eval "python -m ${{ matrix.module }}" \
            --cases benchmarks/cad/cases.yaml "${flags[@]}" \
            --base-url "$BENCH_URL" --api-key-env BENCH_API_KEY \
            --delay 4 --min-accuracy 0 --limit "${{ inputs.limit || 0 }}" --json "reports/${{ matrix.server }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cad-benchmark-${{ matrix.server }}
          path: reports/
